name: daily-collect

on:
  schedule:
    - cron: "43 23 * * *"   # 매일 23:43 UTC = 한국 시간 08:43
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write            # 수집한 JSON을 저장소에 커밋하기 위해

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: uv run python -m trending.pipeline

      - name: Commit data
        run: |
          git config user.name "trending-bot"
          git config user.email "trending-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%F) 수집"
            git push
          fi
