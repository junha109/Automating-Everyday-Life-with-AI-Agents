name: backfill-ai

# AI 처리가 실패한 날짜의 AI 결과만 다시 채운다 (수집은 다시 하지 않음).
# Actions 탭 → backfill-ai → Run workflow 로 수동 실행
on:
  workflow_dispatch:
    inputs:
      from:
        description: "시작일 (YYYY-MM-DD)"
        default: "2026-11-18"
        required: true
      to:
        description: "종료일 (YYYY-MM-DD)"
        default: "2026-11-27"
        required: true

permissions:
  contents: write

concurrency:
  group: daily-collect       # 매일 수집과 동시에 돌며 서로 커밋이 충돌하지 않도록 같은 그룹
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Backfill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
        run: uv run python -m trending.backfill --from "${{ inputs.from }}" --to "${{ inputs.to }}"

      - name: Commit data
        if: always()   # 일부만 채워져도 채운 만큼은 남긴다
        run: |
          git config user.name "trending-bot"
          git config user.email "trending-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: ${{ inputs.from }}~${{ inputs.to }} AI 결과 다시 채움"
            git pull --rebase
            git push
          fi
