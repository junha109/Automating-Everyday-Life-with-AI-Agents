[project]
name = "github-trending-ko"
version = "0.1.0"
description = "GitHub Trending 분야별 비교 + 한국어 요약/번역 대시보드"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trending"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
