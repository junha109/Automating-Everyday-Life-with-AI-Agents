<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 GitHub 한국어판</title>
  <meta name="description" content="매일 아침 GitHub Trending을 분야별로 나누고 한국어로 요약·번역합니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <a class="brand" href="./">오늘의 GitHub <span class="brand__ko">한국어판</span></a>
      <nav class="tabs" aria-label="보기 선택">
        <button class="tab" type="button" data-tab="trending" aria-pressed="true">전체 Trending</button>
        <button class="tab" type="button" data-tab="interest" aria-pressed="false">관심 분야</button>
      </nav>
      <div class="seg seg--mode" role="group" aria-label="기간">
        <button type="button" class="seg__btn" data-mode="day" aria-pressed="true">하루</button>
        <button type="button" class="seg__btn" data-mode="week" aria-pressed="false">일주일</button>
      </div>
      <label class="date-pick">
        <span class="visually-hidden">날짜</span>
        <select id="date-select" aria-label="날짜 선택"></select>
      </label>
    </div>
  </header>

  <main id="main">
    <section class="hero" aria-live="polite">
      <p class="hero__date" id="hero-date"></p>
      <h1 class="hero__line" id="hero-line">불러오는 중…</h1>
      <p class="hero__note" id="hero-note"></p>
    </section>

    <section class="charts" id="charts" aria-label="분야별 통계">
      <figure class="panel">
        <figcaption class="panel__title"><span id="bar-title">분야별 개수</span> <span class="panel__hint">막대를 누르면 그 분야만 봐요</span></figcaption>
        <div class="bar-wrap"><canvas id="bar-chart" role="img" aria-label="분야별 레포 개수 막대 그래프"></canvas></div>
        <table class="visually-hidden" id="bar-table"></table>
      </figure>
      <figure class="panel">
        <figcaption class="panel__title">날짜별 분야 추이 <span class="panel__hint" id="trend-hint"></span></figcaption>
        <div class="multiples" id="multiples"></div>
      </figure>
    </section>

    <section class="controls" aria-label="필터">
      <div class="chips" id="chips" role="group" aria-label="분야 필터"></div>
      <div class="controls__row">
        <label class="search">
          <span class="visually-hidden">검색</span>
          <input id="search" type="search" placeholder="레포 이름, 설명, 요약에서 검색" autocomplete="off">
        </label>
        <div class="seg" role="group" aria-label="표시 언어">
          <button type="button" class="seg__btn" data-lang="ko" aria-pressed="true">한국어</button>
          <button type="button" class="seg__btn" data-lang="orig" aria-pressed="false">원문</button>
        </div>
      </div>
    </section>

    <section aria-label="레포 목록">
      <p class="result-count" id="result-count"></p>
      <ol class="repos" id="repos"></ol>
      <div id="excluded"></div>
    </section>
  </main>

  <footer class="foot">
    <p id="foot-meta"></p>
    <p>요약·번역·분류는 AI가 만든 결과라 틀릴 수 있어요. <strong>근거 부족</strong> 표시가 있는 레포는 원문을 함께 확인하세요.</p>
  </footer>
</body>
</html>
